<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>(function(){var t=localStorage.getItem('theme')||'auto';document.documentElement.setAttribute('data-bs-theme',t==='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t)})();</script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🖥️%3C/text%3E%3C/svg%3E" />
  <style>
  :root {
    --log-font-size: 13px;
    --log-line-height: 1.35;
  }
  #logbox {
    background: #f9f9f9;
    border: 1px solid #ccc;
    padding: 10px;
    white-space: pre;
    overflow: auto;
    height: 70svh;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    font-size: var(--log-font-size);
    line-height: var(--log-line-height);
  }
  [data-bs-theme="dark"] #logbox {
    background: #1e1e1e;
    border-color: #444;
    color: #d4d4d4;
  }
  @media (max-width: 576px) {
    #logbox { height: 70svh; }
    .btn, .form-control, .form-select { min-height: 44px; }
  }
  </style>
</head>

<body class="p-2 p-md-4">
  <div class="container-fluid px-1 px-md-2">
    <div class="d-flex align-items-center gap-2 mb-3">
      <h2 class="mb-0">Log for {{ name }}</h2>
      <div class="theme-seg ms-auto d-none d-md-flex" id="themeToggle" role="group" aria-label="Color theme">
        <button id="th-light" title="Light mode">☀️</button>
        <button id="th-auto"  title="Follow system">Auto</button>
        <button id="th-dark"  title="Dark mode">🌙</button>
      </div>
      <button id="th-cycle" class="btn btn-sm btn-outline-secondary ms-auto d-md-none" style="min-width:36px;min-height:32px;font-size:16px;flex-shrink:0" aria-label="Toggle color theme"></button>
      <a href="/" class="btn btn-secondary btn-sm d-inline-flex align-items-center">Back</a>
    </div>
    <div class="controls py-2 mb-2">
      <div class="d-flex flex-wrap align-items-center gap-2">
        <button id="btn-refresh" class="btn btn-primary btn-sm">Refresh</button>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="auto" checked>
          <label class="form-check-label" for="auto">Auto</label>
        </div>
        <label class="m-0">Every</label>
        <select id="interval" class="form-select form-select-sm" style="width:auto;">
          <option value="500">500ms</option>
          <option value="1000" selected>1s</option>
          <option value="3000">3s</option>
          <option value="5000">5s</option>
          <option value="10000">10s</option>
          <option value="30000">30s</option>
        </select>
        <label class="m-0">Lines</label>
        <input id="lines" type="number" class="form-control form-control-sm" style="width:90px;" value="500" min="50" step="50" />
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="follow" checked>
          <label class="form-check-label" for="follow">Follow</label>
        </div>
        <button id="btn-bottom" class="btn btn-outline-secondary btn-sm">Bottom</button>
        <div class="ms-auto d-flex align-items-center gap-2">
          <div class="btn-group btn-group-sm" role="group" aria-label="Log view mode">
            <button type="button" class="btn btn-outline-secondary view-btn active" data-view="raw">Raw</button>
            <button type="button" class="btn btn-outline-secondary view-btn" data-view="rich">Rich</button>
          </div>
          <button id="btn-purge" class="btn btn-outline-danger btn-sm">Purge</button>
          <div class="btn-group btn-group-sm" role="group" aria-label="Font size">
            <button type="button" class="btn btn-outline-secondary fs-btn" data-size="11px">S</button>
            <button type="button" class="btn btn-outline-secondary fs-btn active" data-size="13px">M</button>
            <button type="button" class="btn btn-outline-secondary fs-btn" data-size="16px">L</button>
          </div>
        </div>
      </div>
    </div>
    <div id="logbox" aria-live="polite">{{ content|e }}</div>
  </div>

  <script>
  const name_    = {{ name | tojson }};
  const slug_    = {{ slug | tojson }};
  const logbox   = document.getElementById('logbox');
  const btnRefresh = document.getElementById('btn-refresh');
  const btnBottom  = document.getElementById('btn-bottom');
  const btnPurge   = document.getElementById('btn-purge');
  const chkAuto  = document.getElementById('auto');
  const selInterval = document.getElementById('interval');
  const inpLines = document.getElementById('lines');
  const chkFollow = document.getElementById('follow');
  let timer = null;
  let viewMode = localStorage.getItem('logViewMode') || 'raw';
  let lastTxt = '';

  // ANSI color map (standard 8 + bright 8)
  const ANSI_FG = {30:'#000',31:'#cc0000',32:'#4e9a06',33:'#c4a000',34:'#3465a4',35:'#75507b',36:'#06989a',37:'#d3d7cf',90:'#555753',91:'#ef2929',92:'#8ae234',93:'#fce94f',94:'#729fcf',95:'#ad7fa8',96:'#34e2e2',97:'#eeeeec'};
  const ANSI_BG = {40:'#000',41:'#cc0000',42:'#4e9a06',43:'#c4a000',44:'#3465a4',45:'#75507b',46:'#06989a',47:'#d3d7cf',100:'#555753',101:'#ef2929',102:'#8ae234',103:'#fce94f',104:'#729fcf',105:'#ad7fa8',106:'#34e2e2',107:'#eeeeec'};

  function ansiToHtml(text) {
    let html = '';
    let bold = false, fg = null, bg = null;
    // split on ESC[ sequences
    const parts = text.split(/\x1b\[([0-9;]*)m/);
    for (let i = 0; i < parts.length; i++) {
      if (i % 2 === 0) {
        // plain text chunk
        html += parts[i].replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      } else {
        // SGR codes
        const codes = parts[i] === '' ? [0] : parts[i].split(';').map(Number);
        let style = '', cls = '';
        codes.forEach(c => {
          if (c === 0) { bold = false; fg = null; bg = null; }
          else if (c === 1) { bold = true; }
          else if (c === 22) { bold = false; }
          else if (ANSI_FG[c]) { fg = ANSI_FG[c]; }
          else if (ANSI_BG[c]) { bg = ANSI_BG[c]; }
          else if (c === 39) { fg = null; }
          else if (c === 49) { bg = null; }
        });
        // open span for next text chunk
        let s = '';
        if (fg) s += `color:${fg};`;
        if (bg) s += `background:${bg};`;
        if (bold) s += 'font-weight:bold;';
        if (s) html += `<span style="${s}">`;
        else html += `<span>`;
      }
    }
    html += '</span>'.repeat(Math.floor(parts.length / 2));
    return html;
  }

  function renderLog(txt) {
    if (viewMode === 'rich') {
      logbox.innerHTML = ansiToHtml(txt || '');
    } else {
      logbox.textContent = txt || '';
    }
  }

  async function fetchLog() {
    const lines = Math.max(1, parseInt(inpLines.value || '500', 10));
    const url = `/api/log/${encodeURIComponent(slug_)}?lines=${lines}&t=${Date.now()}`;
    try {
      const res = await fetch(url, { cache: 'no-store' });
      const txt = await res.text();
      const atBottom = (logbox.scrollTop + logbox.clientHeight + 5 >= logbox.scrollHeight);
      lastTxt = txt;
      renderLog(txt);
      if (chkFollow.checked || atBottom) logbox.scrollTop = logbox.scrollHeight;
    } catch(e) {
      logbox.textContent = `Error fetching log: ${e}`;
    }
  }

  // Raw/Rich toggle
  (function() {
    const btns = document.querySelectorAll('.view-btn');
    function setView(mode) {
      viewMode = mode;
      localStorage.setItem('logViewMode', mode);
      btns.forEach(b => b.classList.toggle('active', b.dataset.view === mode));
      renderLog(lastTxt);
    }
    setView(viewMode);
    btns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
  })();

  function startAuto() { stopAuto(); timer = setInterval(fetchLog, parseInt(selInterval.value, 10)); }
  function stopAuto()  { if (timer) clearInterval(timer); timer = null; }

  btnRefresh.addEventListener('click', fetchLog);
  btnBottom.addEventListener('click',  () => { logbox.scrollTop = logbox.scrollHeight; });
  chkAuto.addEventListener('change',   () => chkAuto.checked ? startAuto() : stopAuto());
  selInterval.addEventListener('change', () => { if (chkAuto.checked) startAuto(); });
  inpLines.addEventListener('change', fetchLog);

  btnPurge.addEventListener('click', async () => {
    if (!confirm(`Purge all logs for "${name_}"? This cannot be undone.`)) return;
    btnPurge.disabled = true;
    try {
      const res = await fetch(`/purge/${encodeURIComponent(slug_)}`, { method: 'POST' });
      if (res.ok) {
        logbox.textContent = '';
      } else {
        alert('Purge failed.');
      }
    } catch(e) {
      alert('Purge failed: ' + e);
    } finally {
      btnPurge.disabled = false;
    }
  });

  fetchLog();
  startAuto();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { stopAuto(); }
    else if (chkAuto.checked) { startAuto(); fetchLog(); }
  });
  </script>

  <script>
  (function() {
    const KEY = 'logFontSize';
    const defaultSize = '13px';
    const btns = document.querySelectorAll('.fs-btn');
    function setSize(px) {
      document.documentElement.style.setProperty('--log-font-size', px);
      btns.forEach(b => b.classList.toggle('active', b.dataset.size === px));
    }
    const saved = localStorage.getItem(KEY);
    setSize(saved || defaultSize);
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        const px = btn.dataset.size || defaultSize;
        setSize(px);
        localStorage.setItem(KEY, px);
      });
    });
  })();
  </script>

  <script>
  (function(){
    var CYCLE = ['auto','light','dark'], ICONS = {light:'☀️',auto:'🌓',dark:'🌙'};
    var cycleBtn = document.getElementById('th-cycle');
    function applyMode(mode) {
      localStorage.setItem('theme', mode);
      var eff = mode === 'auto' ? (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light') : mode;
      document.documentElement.setAttribute('data-bs-theme', eff);
      ['light','auto','dark'].forEach(function(m){
        var el = document.getElementById('th-'+m); if (el) el.classList.toggle('active', m === mode);
      });
      if (cycleBtn) cycleBtn.textContent = ICONS[mode];
    }
    ['light','auto','dark'].forEach(function(m){
      var el = document.getElementById('th-'+m);
      if (el) el.addEventListener('click', function(){ applyMode(m); });
    });
    if (cycleBtn) cycleBtn.addEventListener('click', function(){
      var cur = localStorage.getItem('theme') || 'auto';
      applyMode(CYCLE[(CYCLE.indexOf(cur)+1) % CYCLE.length]);
    });
    applyMode(localStorage.getItem('theme') || 'auto');
  })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
